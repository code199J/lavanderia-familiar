<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="App familiar para organizar turnos de lavandería">
    <title>Lavandería Familiar 👕</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <h1>👕 Lavandería Familiar</h1>
            <div class="header-actions">
                <button id="settingsBtn" class="btn btn-ghost" onclick="openSettings()" aria-label="Configuración">⚙️</button>
                <div class="week-nav">
                    <button id="prevWeek" aria-label="Semana anterior">‹</button>
                    <span id="weekLabel"></span>
                    <button id="nextWeek" aria-label="Semana siguiente">›</button>
                </div>
            </div>
        </header>

        <!-- Detergent Alert -->
        <div id="detergentAlert" class="detergent-alert hidden" role="alert">
            <span class="alert-icon">⚠️</span>
            <span class="alert-text">¡NO HAY JABÓN PARA LAVAR!</span>
            <button id="detergentOk" class="alert-btn">Ya compré jabón ✓</button>
        </div>

        <!-- Main Calendar -->
        <main class="calendar" id="calendar" role="grid" aria-label="Calendario de lavandería">
            <!-- Days generated by JS -->
        </main>

        <!-- Legend -->
        <section class="legend" aria-label="Leyenda">
            <h2>📋 Leyenda</h2>
            <div class="legend-grid" id="legendGrid"></div>
        </section>

        <!-- Settings Modal -->
        <dialog id="settingsModal" class="modal">
            <div class="modal-content">
                <header class="modal-header">
                    <h2>⚙️ Configuración</h2>
                    <button id="closeModal" aria-label="Cerrar">×</button>
                </header>
                <div class="modal-body">
                    <fieldset>
                        <legend>👥 Nombres de la familia</legend>
                        <div class="name-inputs" id="nameInputs"></div>
                    </fieldset>
                    <fieldset>
                        <legend>🛏️ Día de ropa de cama (cada 7 días)</legend>
                        <select id="bedSheetsDay"></select>
                    </fieldset>
                    <fieldset>
                        <legend>🧽 Día de paños personales</legend>
                        <div class="row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <select id="clothsDay"></select>
                            <select id="clothsFrequency">
                                <option value="7">Cada 7 días</option>
                                <option value="14" selected>Cada 14 días</option>
                                <option value="21">Cada 21 días</option>
                                <option value="30">Cada 30 días</option>
                            </select>
                        </div>
                    </fieldset>
                    <fieldset>
                        <legend>🧴 Estado del jabón</legend>
                        <label class="toggle">
                            <input type="checkbox" id="hasDetergent">
                            <span class="toggle-slider"></span>
                            <span class="toggle-label">Hay jabón disponible</span>
                        </label>
                    </fieldset>
                    <button id="saveSettings" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </dialog>

        <!-- Day Detail Modal -->
        <dialog id="dayModal" class="modal">
            <div class="modal-content">
                <header class="modal-header">
                    <h2 id="dayModalTitle"></h2>
                    <button id="closeDayModal" aria-label="Cerrar">×</button>
                </header>
                <div class="modal-body" id="dayModalBody"></div>
            </div>
        </dialog>

        <!-- Install Prompt -->
        <div id="installPrompt" class="install-prompt hidden">
            <p>📱 Instala esta app en tu móvil para usarla como nativa</p>
            <button id="installBtn" class="btn btn-primary">Instalar</button>
            <button id="dismissInstall" class="btn btn-ghost">Luego</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // Install prompt handling
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').classList.remove('hidden');
        });
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installPrompt').classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });
        document.getElementById('dismissInstall').addEventListener('click', () => {
            document.getElementById('installPrompt').classList.add('hidden');
        });
    </script>
</body>
</html>
